name: Release OWD Sync

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package

      - name: Publish plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/LICENSE
          release/LICENSE-UPSTREAM
          release/UPSTREAM.md
          release/main.js
          release/manifest.json
          release/styles.css
          release/checksums.txt
          release/owd-sync-*.zip
          --generate-notes
          --title "OWD Sync $GITHUB_REF_NAME (private beta)"
